# NeoSkin 独立前端部署（Nginx）
#
# 场景：只把 NeoSkinFrontend 构建产物放到静态目录，
#       API / 认证 / 皮肤库等动态请求反代到任一端口后端。
#
# 用法：
#   1. 解压 release 到 /var/www/neoskin（包含 app-next/）
#   2. 修改 upstream 地址
#   3. include /etc/nginx/conf.d/neoskin.conf;

upstream neoskin_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name skin.example.com;

    root /var/www/neoskin;
    index index.html;

    client_max_body_size 1100m;
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ---- SPA 静态资源 ----
    location = /app-next/site  { return 301 /app-next/site/; }
    location = /app-next/admin { return 301 /app-next/admin/; }

    location /app-next/site/ {
        try_files $uri $uri/ /app-next/site/index.html;
    }
    location /app-next/admin/ {
        try_files $uri $uri/ /app-next/admin/index.html;
    }

    # 带 hash 的产物长缓存
    location ~* ^/app-next/(site|admin)/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 壳不缓存，保证 bootstrap / CSRF 即时更新
    location = /app-next/site/index.html {
        add_header Cache-Control "no-cache";
    }
    location = /app-next/admin/index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- 后端动态路由 ----
    location ~ ^/(api|auth|user|admin|skinlib|texture|textures|csl|preview|avatar|oauth|lang|raw|setup|_ignition|\.well-known)(/|$) {
        proxy_pass http://neoskin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 独立前端：首页进入 SPA；旧版入口请由后端反向代理单独暴露
    location = / {
        return 302 /app-next/site/;
    }

    # 插件静态资源
    location /plugins/ {
        proxy_pass http://neoskin_backend;
        proxy_set_header Host $host;
    }

    # 可选：强制 HTTPS 后取消注释
    # location / { return 301 https://$host$request_uri; }
}
