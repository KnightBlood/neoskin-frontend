name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Assemble app-next
        shell: pwsh
        run: ./scripts/publish.ps1 -Target release

      - name: Package release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist/pkg
          cp -r release/public/app-next dist/pkg/app-next
          cp -r deploy dist/pkg/deploy
          (
            cd dist/pkg
            zip -r "../neoskin-frontend_${VERSION}.zip" .
          )
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: neoskin-frontend
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: neoskin-frontend
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
